[project]
name = "housebot"
version = "0.1.0"
description = "Daily Western Cape house-listing bot with Telegram alerts"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "selectolax>=0.3.21",
    "typer>=0.12",
]

[project.scripts]
housebot = "housebot.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["housebot"]
